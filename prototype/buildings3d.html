<script type="module">
// The extruded-massing prototype.
//
// Real OSM footprints with real surveyed heights, extruded over the real
// Leaflet basemap the game ships — including the Esri World Imagery crossfade
// that `attachImagery()` fades in from z16.4, so from z17 up the buildings are
// standing on actual aerial photography of the ground they occupy.
//
// Nothing here is mocked. `createMap()` is the game's own, `classify()` and
// `heightMetresOf()` are the game's own, the sample is the survey already
// committed at `prototype/sample/midtown.json` (400 real midtown Manhattan
// footprints, 378 of them carrying a surveyed `height` tag, the Empire State
// among them), and the renderer is `src/map/buildings3d.js` unmodified.
//
// Open it with the repo's dev server, which is the only way ES modules load:
//   python3 tools/devserver.py 5173
//   open http://127.0.0.1:5173/prototype/buildings3d.html
//
// Append ?bench=1 to run the performance harness on load and print the
// numbers into the panel (and into `window.__b3d.results`, for a driver).

import { createMap } from '../src/map/mapView.js';
import { classify, polygonAreaM2, heightMetresOf, levelsOf } from '../src/game/lots.js';
import {
  Buildings3DLayer, projectWorld, pxPerMetreAt, sunFromHour, massingHeightM,
  drawScene, orderVisible, projectBuilding,
} from '../src/map/buildings3d.js';

const $ = (id) => document.getElementById(id);
const hud = $('hud');
const benchOut = $('bench');

// --- the survey -------------------------------------------------------------

/**
 * The saved sample, turned into the exact lot shape `buildLots()` emits.
 *
 * Deliberately not a bespoke structure: if this prototype reads a different
 * shape from the game, the thing you looked at and the thing that ships will
 * drift apart, which is the failure `isoart.js` was split to avoid.
 *
 * Overpass is not touched. It has been answering 504 all session, and a black
 * page is a poor way to find out whether your renderer works.
 */
function adopt(elements, { latOff = 0, lngOff = 0, tag = '' } = {}) {
  const lots = [];
  for (const w of elements) {
    const g = w.geometry;
    if (!g || g.length < 3) continue;
    const polygon = g.map((p) => ({ lat: p.lat + latOff, lng: p.lon + lngOff }));
    const areaM2 = polygonAreaM2(polygon);
    if (areaM2 < 12) continue;
    const tags = w.tags || {};
    const kind = tags.amenity === 'parking' ? 'parking' : classify(tags, areaM2);
    lots.push({
      id: 'W' + w.id + tag,
      polygon,
      tags,
      areaM2,
      kind,
      levels: levelsOf(tags, kind),
      // The surveyed number, parsed exactly as the game parses it — feet and
      // all. 378 of these 400 buildings carry one.
      heightM: heightMetresOf(tags),
      center: polygon.reduce((a, p, i, arr) => ({
        lat: a.lat + p.lat / arr.length, lng: a.lng + p.lng / arr.length,
      }), { lat: 0, lng: 0 }),
      owned: false,
    });
  }
  return lots;
}

let raw = [];
let lots = [];
let map = null;
let layer = null;
let hour = 15.5;

// --- the map ----------------------------------------------------------------

const MIDTOWN = { lat: 40.74854, lng: -73.98607 };

async function boot() {
  const res = await fetch('./sample/midtown.json');
  const json = await res.json();
  raw = json.elements;
  lots = adopt(raw);

  // `?lat=&lng=&z=&hour=` so a screenshot can be aimed without clicking.
  const q = new URLSearchParams(location.search);
  const at = {
    lat: parseFloat(q.get('lat')) || MIDTOWN.lat,
    lng: parseFloat(q.get('lng')) || MIDTOWN.lng,
  };
  if (q.has('hour')) hour = parseFloat(q.get('hour'));
  map = createMap('map', at, parseFloat(q.get('z')) || 17);
  // The game caps at 21 and upscales; this prototype has no reason to go past
  // Esri World Imagery's last native zoom, where the photography is sharp.
  map.setMaxZoom(20);

  layer = new Buildings3DLayer(map, {
    enabled: true,
    // Lower than the game's intended z17 so the transition itself is visible:
    // you can watch flat outlines become volume as you zoom through it.
    minZoom: 15,
    shadowMinZoom: 16,
    sun: sunFromHour(hour),
    onStats: paintHud,
  });
  layer.sync({ lots });
  layer.redraw();

  verifyProjection();
  paintHud({ ms: layer.lastMs, drawn: layer.lastCount, zoom: map.getZoom() });

  if (new URLSearchParams(location.search).has('bench')) {
    // Give the tiles and the first paint a moment, then run unattended.
    setTimeout(() => runBench([400, 1700]), 1500);
  }
}

/**
 * Prove the hand-written projection against the live Leaflet, rather than
 * asserting it in a comment.
 *
 * `projectWorld()` exists so the geometry can be precomputed once in zoom-0
 * pixels and so the maths is testable under `jsc`, which has never seen a map.
 * The cost of writing it out is that it could drift from what Leaflet actually
 * does. So: check, at load, against `map.project(ll, 0)`, and say the number.
 */
function verifyProjection() {
  let worst = 0;
  const probes = [
    [40.7484, -73.9857], [0, 0], [51.5074, -0.1278], [-33.8688, 151.2093],
    [64.1466, -21.9426], [-54.8019, -68.3030],
  ];
  for (const [lat, lng] of probes) {
    const mine = projectWorld(lat, lng);
    const theirs = map.project(L.latLng(lat, lng), 0);
    worst = Math.max(worst, Math.abs(mine.x - theirs.x), Math.abs(mine.y - theirs.y));
  }
  // And the metres-per-pixel scalar against Leaflet's own distance measure.
  const c = map.getCenter();
  const z = map.getZoom();
  const a = map.project(c, z);
  const b = a.add(L.point(100, 0));
  const metresPer100px = map.distance(c, map.unproject(b, z));
  const mine100 = 100 / pxPerMetreAt(c.lat, z);
  const scaleErr = Math.abs(metresPer100px - mine100) / metresPer100px;
  window.__b3d.projectionError = { worstPx: worst, scaleRelErr: scaleErr };
  return { worst, scaleErr };
}

// --- the HUD ----------------------------------------------------------------

function paintHud({ ms = 0, drawn = 0, zoom = 0 } = {}) {
  const pe = window.__b3d.projectionError;
  const mpp = map ? (1 / pxPerMetreAt(map.getCenter().lat, zoom || map.getZoom())) : 0;
  const surveyed = lots.filter((l) => l.heightM != null).length;
  const tallest = lots.reduce((m, l) => Math.max(m, massingHeightM(l)), 0);
  const cls = ms > 33 ? 'warn' : (ms > 16 ? '' : 'good');
  hud.innerHTML =
    `<b>${lots.length}</b> footprints · <b>${surveyed}</b> surveyed heights · `
    + `tallest <b>${Math.round(tallest)} m</b>\n`
    + `z<b>${(zoom || 0).toFixed(2)}</b> · <b>${mpp.toFixed(3)}</b> m/px · `
    + `drawn <b>${drawn}</b> · redraw <b class="${cls}">${ms.toFixed(1)} ms</b>\n`
    + (pe
      ? `projection vs Leaflet: <b>${pe.worstPx.toExponential(1)}</b> px worst, `
        + `scale err <b>${(pe.scaleRelErr * 100).toExponential(1)}%</b>`
      : '');
}

// --- performance ------------------------------------------------------------
//
// The question is not "how fast is one redraw", it is "does a pan stutter".
// Those are different measurements and conflating them is how a renderer ships
// feeling bad while its benchmark looks fine. So this measures three things:
//
//   1. REDRAW COST. How long `drawScene` takes for N buildings, at the moment
//      a gesture ends. A single hitch here is invisible; it only matters that
//      it stays under a frame or two.
//   2. FRAME TIME DURING A PAN. Sampled from requestAnimationFrame across a
//      scripted `panBy`. This is the number that decides whether it ships.
//   3. FRAME TIME DURING A ZOOM. Same, across a scripted `setZoom`, which is
//      the harder case because Leaflet is transforming panes and loading tiles
//      at the same time.
//
// 2 and 3 are run TWICE, with the massing on and with it off, because a frame
// time with no control is not a measurement — if the map alone cannot hold 60
// fps on this hardware then neither can the map plus anything.

/**
 * Stamp the real sample out into a lattice, to reach counts the game really
 * loads.
 *
 * Honest about what this is: the same 400 real Manhattan footprints, with
 * their real heights, repeated on a grid. The lattice pitch is a fraction of
 * the sample's own bounding box, so the copies interleave and the on-screen
 * density rises to the 3-6k buildings/km² the design budgets for at z17.
 * Buildings therefore overlap, which makes this a slightly PESSIMISTIC fill
 * test rather than an optimistic one — there is more paint per pixel here than
 * in a real city, not less.
 */
function densify(target) {
  const pitchLat = 0.0068 * 0.42;
  const pitchLng = 0.0101 * 0.42;
  const out = adopt(raw).slice();
  let ring = 1;
  while (out.length < target) {
    for (let dy = -ring; dy <= ring && out.length < target; dy++) {
      for (let dx = -ring; dx <= ring && out.length < target; dx++) {
        if (Math.max(Math.abs(dx), Math.abs(dy)) !== ring) continue;
        const copy = adopt(raw, {
          latOff: dy * pitchLat, lngOff: dx * pitchLng, tag: `#${dx},${dy}`,
        });
        for (const l of copy) { if (out.length < target) out.push(l); }
      }
    }
    ring++;
    if (ring > 12) break;
  }
  return out;
}

/** Median and 95th percentile of a sample, which is what a frame budget is. */
function stats(xs) {
  if (!xs.length) return { n: 0, med: 0, p95: 0, max: 0, mean: 0 };
  const s = [...xs].sort((a, b) => a - b);
  const at = (q) => s[Math.min(s.length - 1, Math.floor(q * s.length))];
  return {
    n: s.length,
    med: at(0.5),
    p95: at(0.95),
    max: s[s.length - 1],
    mean: s.reduce((a, b) => a + b, 0) / s.length,
  };
}

/** Sample every animation frame for `ms`, returning the intervals. */
function sampleFrames(ms, during) {
  return new Promise((resolve) => {
    const gaps = [];
    let last = performance.now();
    const t0 = last;
    let raf = requestAnimationFrame(function step(now) {
      gaps.push(now - last);
      last = now;
      if (now - t0 < ms) raf = requestAnimationFrame(step);
      else { cancelAnimationFrame(raf); resolve(gaps); }
    });
    if (during) during();
  });
}

const settle = (ms) => new Promise((r) => setTimeout(r, ms));

/**
 * Load `count` real buildings, centred on the view, and keep exactly those.
 *
 * Without the trim the cull quietly does its job and the benchmark measures
 * 491 buildings while the label says 700 — a fine result for the renderer and
 * a useless one for the question "what does 700 cost". Trimming to the N
 * NEAREST the middle of the screen means the working set is a real, contiguous
 * piece of city rather than a scatter, which is what the cull sees in the game.
 */
function loadWorkingSet(count, zoom) {
  lots = densify(count * 3);
  layer.table.clear();
  layer.prepared = [];
  layer.sync({ lots });
  map.setView([MIDTOWN.lat, MIDTOWN.lng], zoom, { animate: false });
  layer.redraw();
  const cam = layer.cam;
  const cx = cam.width / 2;
  const cy = cam.height / 2;
  layer.prepared = layer.prepared
    .map((p) => {
      const dx = p.cx * cam.scale - cam.offX - cx;
      const dy = p.cy * cam.scale - cam.offY - cy;
      return { p, d: dx * dx + dy * dy };
    })
    .sort((a, b) => a.d - b.d)
    .slice(0, count)
    .map((e) => e.p);
  layer.redraw();
}

/**
 * Time N redraws and return the distribution.
 *
 * Warmed up first, because the first call grows the scratch arrays and fills
 * the shade cache, and timing a cold cache is timing the wrong thing.
 */
function timeRedraws(fn, n = 24) {
  for (let i = 0; i < 4; i++) fn();
  const out = [];
  let last = 0;
  for (let i = 0; i < n; i++) {
    const t = performance.now();
    last = fn();
    out.push(performance.now() - t);
  }
  return { stats: stats(out), drawn: last };
}

/**
 * A scripted pan and a scripted zoom, sampling every animation frame.
 *
 * This is the number that decides whether the feature ships. The redraw cost
 * above is a hitch at the END of a gesture and one frame of it is invisible;
 * a frame time during the gesture is felt on every single frame.
 *
 * Redraws are counted separately for the pan window and the zoom window,
 * rather than across the whole routine, because the setView calls that frame
 * each pass legitimately fire their own `moveend` and would otherwise be
 * counted as gesture redraws.
 */
async function gestureAt(zoom) {
  map.setView([MIDTOWN.lat, MIDTOWN.lng], zoom, { animate: false });
  await settle(280);

  let redraws = 0;
  const orig = layer.redraw.bind(layer);
  layer.redraw = (...a) => { redraws++; return orig(...a); };

  redraws = 0;
  const pan = await sampleFrames(1100, () => {
    map.panBy([260, 180], { animate: true, duration: 0.9, easeLinearity: 1 });
  });
  const redrawsInPan = redraws;
  await settle(260);

  redraws = 0;
  const zoomGaps = await sampleFrames(900, () => {
    map.setZoom(Math.min(20, zoom + 1), { animate: true });
  });
  const redrawsInZoom = redraws;

  layer.redraw = orig;
  await settle(200);
  map.setView([MIDTOWN.lat, MIDTOWN.lng], zoom, { animate: false });
  await settle(150);
  // Drop the first two of each: the first rAF after a timeout measures the
  // timeout, not the gesture.
  return {
    pan: stats(pan.slice(2)), zoom: stats(zoomGaps.slice(2)),
    redrawsInPan, redrawsInZoom,
  };
}

/**
 * Bytes allocated per redraw.
 *
 * The design's hard rule is zero steady-state allocation, because GC pauses on
 * a phone present as exactly the stutter people complain about. Claiming zero
 * is cheap; measuring it needs `--enable-precise-memory-info` for a truthful
 * `usedJSHeapSize` and `--js-flags=--expose-gc` so the heap can be settled
 * before and after. Without those flags this reports what it could not do
 * rather than guessing.
 */
function allocProbe(n = 400, work = null) {
  if (!performance.memory) return { ok: false, why: 'performance.memory unavailable' };
  const gc = window.gc;
  if (gc) { gc(); gc(); }
  // Sampled and summed over POSITIVE deltas only.
  //
  // A single before/after pair is not trustworthy here and the first version
  // of this probe proved it: at 1700 buildings a 400-redraw loop takes two
  // seconds, a minor GC runs in the middle of it, and the end-to-end delta
  // comes out SMALLER than the same loop over 50 buildings that finished
  // before the collector woke up. That produced a negative bytes-per-building
  // slope, which is nonsense. Summing only the rises measures what was
  // allocated regardless of what was collected along the way.
  let total = 0;
  let last = performance.memory.usedJSHeapSize;
  const start = last;
  let collections = 0;
  for (let i = 0; i < n; i++) {
    if (work) work(); else layer.redraw();
    if ((i & 15) === 15) {
      const now = performance.memory.usedJSHeapSize;
      if (now > last) total += now - last; else collections++;
      last = now;
    }
  }
  const endRaw = performance.memory.usedJSHeapSize;
  if (endRaw > last) total += endRaw - last;
  if (gc) { gc(); gc(); }
  const afterGc = performance.memory.usedJSHeapSize;
  return {
    ok: true,
    gcAvailable: !!gc,
    n,
    allocated: total,
    perRedraw: total / n,
    netBytes: endRaw - start,
    retainedBytes: afterGc - start,
    collections,
  };
}

const ZOOMS = [17, 18, 19, 20];

async function runBench(counts) {
  for (const b of ['b700', 'b1700', 'ball']) $(b).disabled = true;
  const wasEnabled = layer.enabled;

  // The control first, once per zoom: the same gestures with the massing off.
  // A frame time with no control is not a measurement — if the map alone
  // cannot hold 60 fps on this hardware then neither can the map plus
  // anything, and the massing would be blamed for it.
  benchOut.textContent = 'benching: control pass (massing off)…';
  layer.setEnabled(false);
  const control = {};
  for (const z of ZOOMS) control[z] = await gestureAt(z);
  layer.setEnabled(true);

  const rows = [];
  for (const count of counts) {
    for (const z of ZOOMS) {
      benchOut.textContent = `benching ${count} @ z${z}…`;
      loadWorkingSet(count, z);

      // What the cull actually keeps at this zoom — the realistic figure.
      const culled = timeRedraws(() => layer.redraw());

      // And the same working set with the cull opened right up, so every one
      // of the N is projected and painted. This separates "the renderer is
      // fast" from "the cull threw most of them away", which at z20 it does.
      const sun = layer.sun;
      const forced = timeRedraws(() => {
        const ctx = layer.ctx;
        ctx.setTransform(1, 0, 0, 1, 0, 0);
        ctx.clearRect(0, 0, layer.canvas.width, layer.canvas.height);
        const dpr = Math.min(window.devicePixelRatio || 1, 2);
        ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
        return drawScene(ctx, layer.prepared, layer.cam, layer.scratch, {
          sun, shadows: z >= layer.shadowMinZoom, pad: 1e7,
        });
      });

      const g = await gestureAt(z);
      rows.push({
        count, zoom: z,
        drawn: culled.drawn, redrawMs: culled.stats,
        forcedDrawn: forced.drawn, forcedMs: forced.stats,
        pan: g.pan, zoomG: g.zoom,
        redrawsInPan: g.redrawsInPan, redrawsInZoom: g.redrawsInZoom,
        panControl: control[z].pan, zoomControl: control[z].zoom,
      });
    }
  }

  // Allocation, measured at two very different building counts.
  //
  // One number cannot answer the question. What matters is not "how many
  // bytes" but "does it grow with the number of buildings": a fixed cost per
  // redraw is a handful of Leaflet Points and one camera record, and the layer
  // redraws once per gesture, so it is irrelevant. A cost per BUILDING is the
  // thing the design forbids, because that is what turns into a GC pause.
  // Short runs at four counts, so no collector wakes up inside any of them.
  //
  // `performance.memory.usedJSHeapSize` cannot be trusted over a long loop:
  // it moves in V8's semi-space growth steps and a minor GC inside the window
  // silently subtracts from the total. A 400-redraw probe gave three different
  // answers on three runs. Forty redraws at each of four building counts is
  // short enough to stay collection-free, and the SLOPE across the counts is
  // the number that actually matters — a fixed cost per redraw is a handful of
  // Leaflet Points once per gesture and is irrelevant; a cost per BUILDING is
  // the thing the design forbids.
  benchOut.textContent = 'benching: allocation probe…';

  // Same probe, but PROJECTION ONLY — cull, sort and project every building,
  // and issue not one canvas call. Differencing this against the full redraw
  // says whether the allocation is in this module's arithmetic (which we can
  // fix) or in the Canvas2D bindings (which we cannot, short of not drawing).
  const projectOnly = (count) => {
    loadWorkingSet(count, 17);
    return allocProbe(40, () => {
      const order = orderVisible(layer.prepared, layer.cam, layer.scratch, {});
      for (let k = 0; k < order.length; k++) {
        projectBuilding(layer.prepared[order[k]], layer.cam, layer.scratch);
      }
      return order.length;
    });
  };
  const projOnly = [50, 1700].map((c) => Object.assign({ buildings: c }, projectOnly(c)));

  const ladder = [];
  for (const c of [50, 400, 800, 1700]) {
    loadWorkingSet(c, 17);
    ladder.push(Object.assign({ buildings: c }, allocProbe(40)));
  }
  const clean = ladder.filter((a) => a.ok && a.collections === 0);
  let perBuilding = null;
  if (clean.length >= 2) {
    const lo = clean[0], hi = clean[clean.length - 1];
    perBuilding = (hi.perRedraw - lo.perRedraw) / (hi.buildings - lo.buildings);
  }
  const projSlope = (projOnly[1].perRedraw - projOnly[0].perRedraw) / (1700 - 50);
  const alloc = { ok: ladder[0].ok, why: ladder[0].why,
    gcAvailable: ladder[0].gcAvailable, ladder, perBuilding, projOnly, projSlope };

  // Put the honest sample back.
  lots = adopt(raw);
  layer.table.clear();
  layer.prepared = [];
  layer.sync({ lots });
  layer.setEnabled(wasEnabled);
  layer.redraw();

  const text = report(rows, alloc);
  window.__b3d.results = rows;
  window.__b3d.alloc = alloc;
  window.__b3d.text = text;
  document.title = 'BENCH DONE';
  const post = new URLSearchParams(location.search).get('post');
  if (post) {
    try {
      await fetch(post, {
        method: 'POST', mode: 'no-cors',
        headers: { 'Content-Type': 'text/plain' },
        body: text + '\n\nRAW ' + JSON.stringify({ rows, alloc }),
      });
    } catch (e) { /* the numbers are on screen either way */ }
  }
  for (const b of ['b700', 'b1700', 'ball']) $(b).disabled = false;
  return rows;
}

function fmt(s) {
  return `${s.med.toFixed(1).padStart(5)} ${s.p95.toFixed(1).padStart(5)} `
    + `${s.max.toFixed(1).padStart(6)}`;
}

function report(rows, alloc) {
  const dpr = Math.min(window.devicePixelRatio || 1, 2);
  const size = map.getSize();
  const L = [];
  L.push(`viewport ${size.x}x${size.y} css · dpr ${dpr} (capped at 2) · `
    + `backing store ${Math.round(size.x * dpr)}x${Math.round(size.y * dpr)}`);
  L.push(navigator.userAgent);
  L.push('');
  L.push('REDRAW COST (one redraw, fired at the end of a gesture)');
  L.push('  set    z   drawn   med   p95    max |  forced   med   p95    max');
  for (const r of rows) {
    L.push(`  ${String(r.count).padStart(4)} z${r.zoom}  `
      + `${String(r.drawn).padStart(5)} ${fmt(r.redrawMs)} | `
      + `${String(r.forcedDrawn).padStart(6)} ${fmt(r.forcedMs)}`);
  }
  L.push('');
  L.push('FRAME TIME DURING THE GESTURE (ms/frame; control = massing off)');
  L.push('  set    z   pan:med   p95    max | ctrl:med   max | redraws pan/zoom');
  for (const r of rows) {
    L.push(`  ${String(r.count).padStart(4)} z${r.zoom}  ${fmt(r.pan)} | `
      + `${r.panControl.med.toFixed(1).padStart(8)} ${r.panControl.max.toFixed(1).padStart(5)} | `
      + `${r.redrawsInPan}/${r.redrawsInZoom}`);
  }
  L.push('');
  L.push('  set    z  zoom:med   p95    max | ctrl:med   max');
  for (const r of rows) {
    L.push(`  ${String(r.count).padStart(4)} z${r.zoom}  ${fmt(r.zoomG)} | `
      + `${r.zoomControl.med.toFixed(1).padStart(8)} ${r.zoomControl.max.toFixed(1).padStart(5)}`);
  }
  L.push('');
  L.push('ALLOCATION PER REDRAW');
  if (!alloc.ok) {
    L.push(`  not measured: ${alloc.why}`);
  } else {
    for (const a of alloc.ladder) {
      L.push(`  ${String(a.buildings).padStart(5)} buildings: `
        + `${a.perRedraw.toFixed(0).padStart(7)} B/redraw over ${a.n} redraws, `
        + `${a.collections} collections, ${a.retainedBytes} B retained after gc`);
    }
    L.push(alloc.perBuilding == null
      ? '  slope: not measurable, a collection ran inside every window'
      : `  full redraw slope: ${alloc.perBuilding.toFixed(2)} B per building`);
    for (const a of alloc.projOnly) {
      L.push(`  projection only, ${String(a.buildings).padStart(5)} buildings: `
        + `${a.perRedraw.toFixed(0).padStart(7)} B/pass, ${a.collections} collections`);
    }
    L.push(`  projection-only slope: ${alloc.projSlope.toFixed(2)} B per building `
      + `-> the canvas calls account for `
      + `${(alloc.perBuilding - alloc.projSlope).toFixed(2)} B per building`);
  }
  benchOut.textContent = L.join('\n');
  const last = rows[rows.length - 1];
  drawStrip([last.pan.med, last.pan.p95, last.pan.max]);
  return L.join('\n');
}

/** Frame intervals as a strip, because a p95 hides the one spike that hurts. */
function drawStrip(gaps) {
  const cv = $('strip');
  const ctx = cv.getContext('2d');
  ctx.clearRect(0, 0, cv.width, cv.height);
  const top = 50; // ms full scale
  ctx.strokeStyle = '#2a3a2c';
  ctx.beginPath();
  const y60 = cv.height - (16.7 / top) * cv.height;
  ctx.moveTo(0, y60); ctx.lineTo(cv.width, y60); ctx.stroke();
  const w = cv.width / Math.max(1, gaps.length);
  for (let i = 0; i < gaps.length; i++) {
    const h = Math.min(1, gaps[i] / top) * cv.height;
    ctx.fillStyle = gaps[i] > 33 ? '#c2560c' : (gaps[i] > 20 ? '#a08e4d' : '#5f8f6c');
    ctx.fillRect(i * w, cv.height - h, Math.max(1, w - 0.5), h);
  }
}

// --- controls ---------------------------------------------------------------

$('fold').onclick = () => {
  const p = $('panel');
  p.classList.toggle('min');
  $('fold').textContent = p.classList.contains('min') ? '+' : '–';
};

$('hour').oninput = (e) => {
  hour = parseFloat(e.target.value);
  const hh = Math.floor(hour) % 24;
  const mm = Math.round((hour - Math.floor(hour)) * 60);
  $('hourV').textContent = `${String(hh).padStart(2, '0')}:${String(mm).padStart(2, '0')}`;
  // Exactly the hook the game clock plugs into: `rhythm.js` owns the in-game
  // hour and `darkness`, and this is the one line that connects them.
  layer.setSun(sunFromHour(hour));
};

$('alt').oninput = (e) => {
  const v = parseFloat(e.target.value);
  // Metres above the ground, not viewport heights — see `cameraAltitudeFor`.
  // The slider floor is 900 m because below that the camera starts entering
  // the taller half of the building stock.
  if (v <= 900) {
    layer.camAlt = null;
    $('altV').textContent = 'auto';
  } else {
    layer.camAlt = v;
    $('altV').textContent = Math.round(v) + 'm';
  }
  // The layer builds its camera per redraw, so overriding means patching the
  // record it just built. Kept in the prototype rather than the module: it is
  // an art-direction dial, not a feature.
  layer.redraw();
};

const toggle = (id, fn) => {
  $(id).onclick = (e) => {
    const on = !e.target.classList.contains('on');
    e.target.classList.toggle('on', on);
    fn(on);
  };
};
toggle('onoff', (on) => layer.setEnabled(on));
toggle('shadows', (on) => { layer.shadowMinZoom = on ? 16 : 99; layer.redraw(); });
toggle('lift', (on) => {
  layer.lift = on;
  layer.table.clear();
  layer.prepared = [];
  layer.sync({ lots });
  layer.redraw();
});
toggle('tiles', (on) => {
  for (const name of ['tilePane', 'imagery']) {
    const p = map.getPane(name);
    if (p) p.style.display = on ? '' : 'none';
  }
});

$('esb').onclick = () => map.setView([40.74844, -73.98565], 19, { animate: true });
$('z17').onclick = () => map.setZoom(17);
$('z19').onclick = () => map.setZoom(19);
$('b700').onclick = () => runBench([400]);
$('b1700').onclick = () => runBench([1700]);
$('ball').onclick = () => runBench([400, 1700]);

// Tapping a building says what it is, which is the only way to check that the
// height being drawn is the height that was surveyed.
document.getElementById('map').addEventListener('click', (ev) => {
  if (!layer || !layer.enabled) return;
  const rect = layer.canvas.getBoundingClientRect();
  const lot = layer.pick(ev.clientX - rect.left, ev.clientY - rect.top);
  if (!lot) return;
  const h = massingHeightM(lot, { lift: false });
  benchOut.textContent =
    `${lot.tags.name || lot.kind}\n`
    + `  ${Math.round(lot.areaM2)} m² · ${lot.levels} levels\n`
    + `  ${h.toFixed(1)} m ${lot.heightM != null ? '(surveyed)' : '(from levels)'}\n`
    + `  drawn at ${massingHeightM(lot).toFixed(1)} m with the lift`;
});

// Exposed so a driver can run this page the way the repo's checks drive the
// game, rather than by clicking.
window.__b3d = {
  get map() { return map; },
  get layer() { return layer; },
  get lots() { return lots; },
  bench: runBench,
  densify,
  results: null,
  text: '',
  projectionError: null,
};

// Anything that goes wrong has to be visible to a driver too, not just to
// somebody looking at the screen — a bench that never reports is otherwise
// indistinguishable from a page that never booted.
function shout(what) {
  const post = new URLSearchParams(location.search).get('post');
  if (!post) return;
  try {
    fetch(post, { method: 'POST', mode: 'no-cors',
      headers: { 'Content-Type': 'text/plain' }, body: what });
  } catch (e) { /* nothing left to try */ }
}
window.addEventListener('error', (e) => shout('PAGE ERROR: ' + e.message));
window.addEventListener('unhandledrejection', (e) => shout('REJECTED: ' + e.reason));

boot().then(() => {
  if (!new URLSearchParams(location.search).has('bench')) {
    shout('BOOTED OK\n' + hud.textContent);
  }
}).catch((e) => {
  hud.innerHTML = `<span class="warn">boot failed:</span> ${e}`;
  benchOut.textContent = (e && e.stack) || '';
  shout('BOOT FAILED: ' + e + '\n' + ((e && e.stack) || ''));
});
</script>
</body>
</html>
